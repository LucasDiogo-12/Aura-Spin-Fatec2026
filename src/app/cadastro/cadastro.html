<form (ngSubmit)="validar()">

  <div *ngIf="mostrarAviso" class="alert alert-warning alert-dismissible fade show my-3" role="alert">
    <strong>Verifique!</strong> {{ mensagemErro }}
  </div>
    <div class="col">
    <div class="mb-2">
        <label class="form-label">Nome</label>
        <input type="name" class="form-control" [(ngModel)]="nome" name="nome">
    </div>
    <div class="mb-3">
        <label class="form-label">Data de Nascimento</label>
        <input type="birthday" class="form-control" [(ngModel)]="dataNascimento" name="email" placeholder="DD/MM/AAAA">
    </div>
    <div class="mb-3">
        <label class="form-label">Endereço</label>
        <input type="address" class="form-control" [(ngModel)]="endereco" name="email" placeholder="Cidade, Rua, Número">
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="seuemail@gmail.com">
    </div>
    <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" class="form-control" [(ngModel)]="senha" name="senha">
    </div>
    <div class="mb-3">
        <label class="form-label">Confirmar Senhar</label>
        <input type="password" class="form-control" [(ngModel)]="confirmarSenha" name="email" placeholder="Digite sua senha novamente">
    </div>
        <br>
        <button class="btn btn-outline-success w-100" >Entrar</button>
    </div>
</form>
