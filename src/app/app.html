<header>

    <div class="container-fluid px-4 d-flex justify-content-between align-items-center">

      <!-- 1. Lado Esquerdo: Logo -->

        >

        <a routerLink="/vitrine" class="btn btn-secondary">Promoções</a> 
      </div>

      <!-- 3. Lado Direito: Links de Acesso -->

        <a routerLink="/carrinho" class="btn btn-secondary">Carrinho</a>
        <a routerLink="/login" class="btn btn-secondary">Login</a>
      </div>

    </div>
  </nav>
</header>
