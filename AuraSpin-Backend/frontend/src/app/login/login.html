<div class="row justify-content-center py-5"><div class="col-md-6 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4">
<h2>Entrar na Aura Spin</h2><p class="text-muted">Acesse sua conta para finalizar o pedido.</p>
<div *ngIf="erro" class="alert alert-danger">{{erro}}</div><div *ngIf="sucesso" class="alert alert-success">{{sucesso}}</div>
<form (ngSubmit)="entrar()"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" [(ngModel)]="email" required>
<label class="form-label">Senha</label><input class="form-control mb-3" type="password" name="senha" [(ngModel)]="senha" required>
<button class="btn btn-success w-100">Entrar</button></form>
<hr><p class="mb-1">Ainda não tem cadastro?</p><a routerLink="/cadastro">Criar uma conta</a>
</div></div></div></div>
